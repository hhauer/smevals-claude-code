[project]
name = "smevals-claude-code"
version = "0.1.0"
description = "A reusable smevals Runner that drives an isolated headless Claude Code session"
requires-python = ">= 3.15"

[project.scripts]
smevals-claude-code = "smevals_claude_code.cli:main"

[dependency-groups]
# bandit, import-linter, pip-audit, pydeps, pytest-cov, and vulture are the
# refactor-audit tool set, driven from outside this repo — see the note at the
# foot of the justfile before concluding any of them is unused.
dev = [
    "bandit>=1.9.4",
    "import-linter>=2.15",
    "pip-audit>=2.10.1",
    "pydeps>=3.0.9",
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
    "ty",
    "vulture>=2.16",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "ARG", "SIM", "ERA", "D", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
